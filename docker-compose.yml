services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: uncertainty
      POSTGRES_PASSWORD: uncertainty
      POSTGRES_DB: uncertainty
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uncertainty -d uncertainty"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://uncertainty:uncertainty@db:5432/uncertainty
    ports:
      - "8080:8080"

volumes:
  pgdata:
